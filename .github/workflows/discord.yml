name: Discord Notification

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Discord
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": "Novo commit enviado!\n\n Mensagem: ${{ github.event.head_commit.message }}\n Autor: ${{ github.event.head_commit.author.name }}\n Link: ${{ github.event.head_commit.url }}"
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}